name: Build APK

# Builds an installable APK and attaches it to the run.
#   • every push to main
#   • every manual run (Actions → Build APK → Run workflow)
#   • every tag starting with v* (also publishes a GitHub Release with the APK)
#
# Optional repository secrets for a signed release build:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the workflow produces a debug-signed APK that installs fine on
# any phone (enable "install unknown apps" for your browser/file manager).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image already ships the Android SDK (compileSdk 34/35).
      # Point Gradle at it rather than downloading a second copy.
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          ls "$SDK" || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Engine checks
        run: npm run engine:check

      - name: Build web app + sync into the Android project
        run: |
          npm run build          # writes dist/ (cap sync copies it into the APK)
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          TASK=assembleDebug
          EXTRA_ARGS=""
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building signed release APK"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            TASK=assembleRelease
            EXTRA_ARGS="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore               -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD               -Pandroid.injected.signing.key.alias=$KEY_ALIAS               -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          else
            echo "Building debug APK (no keystore secret set)"
          fi

          set +e
          ./gradlew "$TASK" --no-daemon --stacktrace $EXTRA_ARGS > /tmp/gradle.log 2>&1
          STATUS=$?
          set -e

          # Surface the reason as a check-run annotation (downloadable via API
          # even when the raw log blob is unreachable).
          if [ $STATUS -ne 0 ]; then
            # Print the actionable part of the log, then mirror it as annotations
            # (the actions log blob is not always reachable from every client).
            REASON=$(sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log | head -40)
            [ -z "$REASON" ] && REASON=$(grep -E "error:|FAILURE:|Could not|Caused by:" /tmp/gradle.log | head -20)
            echo "----- gradle failure -----"
            echo "$REASON"
            echo "--------------------------"
            echo "$REASON" | head -20 | cut -c1-400 | sed 's/%/%25/g;s/\r//g' \
              | while IFS= read -r line; do echo "::error title=Gradle::${line:- }"; done
            exit $STATUS
          fi

          tail -15 /tmp/gradle.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          cd out
          for f in *.apk; do
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              # Stable filename → /releases/latest/download/Hookline.apk
              mv "$f" "Hookline.apk"
            else
              mv "$f" "Hookline-${GITHUB_RUN_NUMBER}.apk"
            fi
          done
          ls -lh

      - name: Verify APK
        run: |
          APK=$(ls out/*.apk | head -1)
          AAPT=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -r | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E "assets/public/index.html|classes.dex|resources.arsc|assets/public/assets" | head -10
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "^package|^application-label|^sdkVersion|^targetSdkVersion|^launchable-activity" || true
          fi
          # Mirror the essentials as a check annotation so it shows up in the run UI.
          ID=$(unzip -p "$APK" AndroidManifest.xml >/dev/null 2>&1 && echo ok || echo missing)
          echo "::notice title=APK::$(ls out/*.apk | head -1) · $(du -h "$APK" | cut -f1) · manifest:$ID · assets:$(unzip -l "$APK" | grep -c 'assets/public')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hookline-APK
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
