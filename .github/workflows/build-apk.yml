name: Build APK

# Builds an installable APK and attaches it to the run.
#   • every push to main
#   • every manual run (Actions → Build APK → Run workflow)
#   • every tag starting with v* (also publishes a GitHub Release with the APK)
#
# Optional repository secrets for a signed release build:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the workflow produces a debug-signed APK that installs fine on
# any phone (enable "install unknown apps" for your browser/file manager).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Engine checks
        run: npm run engine:check

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building signed release APK"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "Building debug APK (no keystore secret set)"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          cd out
          for f in *.apk; do mv "$f" "Hookline-${GITHUB_RUN_NUMBER}.apk"; done
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hookline-APK
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
