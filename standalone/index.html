Here's the thing nobody tells you about hiring: the interview is not a test of skill, it's a test of rehearsal. Most people who interview well have interviewed a lot. They've practiced the answers. They've read the books. So you end up optimising for people who are good at interviews, not people who are good at the job. And those are two completely different skills.

So what do you do instead? The fix is embarrassingly simple. Stop interviewing. Start working together. We now pay every candidate for a paid trial project. It's four to six hours of real work, on a real problem, that we would have paid a contractor for anyway. And in those four hours you learn more than in eight rounds of interviews. You see how they ask questions. You see what they do when they get stuck. You see whether they actually finish things.

The first time we did this, the person who had the best resume did the worst work. And the person who'd been rejected by three other companies finished the trial in three hours and found a bug in our billing system that had been there for a year. We hired her. She ran engineering for four years.

Now, the second mistake is related. Most founders hire for potential when they should hire for pain. Potential is a story you tell yourself about the future. Pain is a thing that is already costing you money every single week. If you can't name the specific thing that is broken right now, you are not ready to hire. You're just lonely.

Third thing, and this one is uncomfortable. Fire faster than feels polite. The average manager waits about three months longer than they should. And here's why that matters. A bad hire doesn't just cost you their salary. It costs you the good people who have to work around them. The best performer on your team is watching how you handle the person who isn't performing. If you tolerate it, you're teaching everyone that the standard is optional.

I want to be careful here, because "fire fast" gets used as an excuse to be cruel. That's not what I mean. It means give clear feedback early, give a real chance to fix it, and if nothing changes in thirty days, make the decision. Documented, kind, and fast. That's the whole thing.

Let me talk about money for a second, because this is where people get weird. You will almost always underpay your first ten hires. Not because you're evil, but because you're scared and you're guessing. The people who join you early are taking a risk that the market doesn't price. So pay them at the top of their band, give them more equity than feels comfortable, and revisit comp every six months without being asked. The cost of replacing a good engineer is somewhere between fifty and two hundred percent of their salary. Paying them ten percent more is the cheapest insurance you will ever buy.

And the last one, which took me the longest to learn. Your job as a founder is not to be the smartest person in the room. It is to build a room where smart people want to stay. I spent three years trying to be right in every meeting. It was exhausting and it made everyone worse. The moment I started asking "what am I missing" instead of "here's what I think", the quality of the decisions went up immediately.
